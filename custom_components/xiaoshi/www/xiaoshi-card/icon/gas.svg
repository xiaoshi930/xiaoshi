<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="燃气费">
  <defs>
    <linearGradient id="gasTile" x1="12%" y1="0%" x2="88%" y2="100%">
      <stop offset="0%" stop-color="#FFD3A8"/>
      <stop offset="28%" stop-color="#FF9A62"/>
      <stop offset="64%" stop-color="#EF4438"/>
      <stop offset="100%" stop-color="#A81C2E"/>
    </linearGradient>
    <linearGradient id="gasVig" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="38%" stop-color="#580712" stop-opacity="0"/>
      <stop offset="100%" stop-color="#580712" stop-opacity="0.32"/>
    </linearGradient>
    <radialGradient id="gasGloss" cx="26%" cy="8%" r="82%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.50"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gasSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="gasHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gasGlyph" x1="26%" y1="0%" x2="74%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#FFFCF7"/>
      <stop offset="100%" stop-color="#FFE3CB"/>
    </linearGradient>
    <linearGradient id="gasCore" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FF9A6B"/>
      <stop offset="52%" stop-color="#EE3A31"/>
      <stop offset="100%" stop-color="#A8121E"/>
    </linearGradient>
    <filter id="gasShadow" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="0" dy="3" stdDeviation="4.5" flood-color="#4E0510" flood-opacity="0.40"/>
    </filter>
    <clipPath id="gasClip"><rect x="0" y="0" width="200" height="200" rx="44"/></clipPath>
  </defs>

  <g clip-path="url(#gasClip)">
    <rect width="200" height="200" fill="url(#gasTile)"/>
    <rect width="200" height="200" fill="url(#gasVig)"/>
    <rect width="200" height="200" fill="url(#gasGloss)"/>
    <rect x="-60" y="50" width="320" height="56" transform="rotate(-26 100 100)" fill="url(#gasSheen)"/>

    <circle cx="100" cy="108" r="62" fill="url(#gasHalo)"/>

    <g transform="translate(100 104) scale(0.90) translate(-100 -104)">
      <g filter="url(#gasShadow)">
        <!-- 外焰：宽底 + 偏向右侧的尖，左侧带内卷舌 -->
        <path d="M112 30
                 C120 56 132 74 142 92
                 C152 110 156 124 152 138
                 C146 160 126 172 100 172
                 C74 172 54 160 48 138
                 C44 124 48 110 58 92
                 C66 78 74 62 80 44
                 C84 60 92 70 100 66
                 C106 60 110 46 112 30 Z"
              fill="url(#gasGlyph)"/>
        <!-- 内焰 -->
        <path d="M100 104
                 C100 104 112 122 118 132
                 C124 142 123 150 119 155
                 C114 165 108 170 100 170
                 C92 170 86 165 81 155
                 C77 150 76 142 82 132
                 C88 122 100 104 100 104 Z"
              fill="url(#gasCore)"/>
      </g>
      <path d="M112 30
               C120 56 132 74 142 92
               C152 110 156 124 152 138
               C146 160 126 172 100 172
               C74 172 54 160 48 138
               C44 124 48 110 58 92
               C66 78 74 62 80 44
               C84 60 92 70 100 66
               C106 60 110 46 112 30 Z"
            fill="none" stroke="#FFFFFF" stroke-opacity="0.72" stroke-width="1.8" stroke-linejoin="round"/>
    </g>

    <rect x="1.6" y="1.6" width="196.8" height="196.8" rx="42.4" fill="none"
          stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>
  </g>
</svg>
