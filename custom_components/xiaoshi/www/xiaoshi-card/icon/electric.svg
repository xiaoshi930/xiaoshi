<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="电费">
  <defs>
    <linearGradient id="elecTile" x1="12%" y1="0%" x2="88%" y2="100%">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="26%" stop-color="#FFC22E"/>
      <stop offset="64%" stop-color="#FB8C00"/>
      <stop offset="100%" stop-color="#D45B00"/>
    </linearGradient>
    <!-- 底部柔和压暗（渐变，不是硬边） -->
    <linearGradient id="elecVig" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="38%" stop-color="#5C2600" stop-opacity="0"/>
      <stop offset="100%" stop-color="#5C2600" stop-opacity="0.30"/>
    </linearGradient>
    <!-- 左上高光 -->
    <radialGradient id="elecGloss" cx="26%" cy="8%" r="82%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.50"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- 斜向镜面反光 -->
    <linearGradient id="elecSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- 图形背后柔光 -->
    <radialGradient id="elecHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="elecGlyph" x1="28%" y1="0%" x2="72%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="58%" stop-color="#FFFCF2"/>
      <stop offset="100%" stop-color="#FFEDC2"/>
    </linearGradient>
    <filter id="elecShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="4.5" flood-color="#6B2A00" flood-opacity="0.38"/>
    </filter>
    <clipPath id="elecClip"><rect x="0" y="0" width="200" height="200" rx="44"/></clipPath>
  </defs>

  <g clip-path="url(#elecClip)">
    <rect width="200" height="200" fill="url(#elecTile)"/>
    <rect width="200" height="200" fill="url(#elecVig)"/>
    <rect width="200" height="200" fill="url(#elecGloss)"/>
    <rect x="-60" y="50" width="320" height="56" transform="rotate(-26 100 100)" fill="url(#elecSheen)"/>

    <circle cx="100" cy="104" r="60" fill="url(#elecHalo)"/>

    <g filter="url(#elecShadow)">
      <path d="M116 44 L64 112 H92 L84 158 L136 88 H106 Z" fill="url(#elecGlyph)"/>
    </g>
    <path d="M116 44 L64 112 H92 L84 158 L136 88 H106 Z" fill="none"
          stroke="#FFFFFF" stroke-opacity="0.72" stroke-width="1.6" stroke-linejoin="round"/>

    <circle cx="142" cy="58" r="5" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="60" cy="136" r="3.5" fill="#FFFFFF" opacity="0.6"/>

    <rect x="1.6" y="1.6" width="196.8" height="196.8" rx="42.4" fill="none"
          stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>
  </g>
</svg>
