<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0091ea"/>
      <stop offset="50%" stop-color="#00b0ff"/>
      <stop offset="100%" stop-color="#40c4ff"/>
    </linearGradient>
    <linearGradient id="blueDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0064b7"/>
      <stop offset="100%" stop-color="#0091ea"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#80d8ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0091ea" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowBlue">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 外圆环 -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#blueDark)" stroke-width="4" opacity="0.9"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#blueGrad)" stroke-width="1.5" opacity="0.6"/>

  <!-- 背景球体 -->
  <circle cx="100" cy="100" r="82" fill="url(#blueGlow)"/>

  <!-- 波浪经纬线 -->
  <path d="M18 100 Q60 80 100 100 Q140 120 182 100" fill="none" stroke="url(#blueGrad)" stroke-width="1.2" opacity="0.5"/>
  <path d="M18 100 Q60 120 100 100 Q140 80 182 100" fill="none" stroke="url(#blueGrad)" stroke-width="1" opacity="0.4"/>
  <path d="M18 75 Q60 55 100 75 Q140 95 182 75" fill="none" stroke="url(#blueGrad)" stroke-width="1" opacity="0.35"/>
  <path d="M18 125 Q60 145 100 125 Q140 105 182 125" fill="none" stroke="url(#blueGrad)" stroke-width="1" opacity="0.35"/>
  <ellipse cx="100" cy="100" rx="40" ry="82" fill="none" stroke="url(#blueGrad)" stroke-width="1" opacity="0.4"/>
  <ellipse cx="100" cy="100" rx="70" ry="82" fill="none" stroke="url(#blueGrad)" stroke-width="1" opacity="0.4"/>

  <!-- 中心水滴 -->
  <g filter="url(#glowBlue)">
    <path d="M100 52 C100 52 72 90 72 112 C72 127 84 139 100 139 C116 139 128 127 128 112 C128 90 100 52 100 52 Z" fill="url(#blueGrad)"/>
    <path d="M100 52 C100 52 72 90 72 112 C72 127 84 139 100 139 C116 139 128 127 128 112 C128 90 100 52 100 52 Z" fill="none" stroke="#fff" stroke-width="0.8" opacity="0.4"/>
    <ellipse cx="92" cy="106" rx="6" ry="10" fill="#fff" opacity="0.25"/>
  </g>

  <!-- 内部小圆环 -->
  <circle cx="100" cy="100" r="38" fill="none" stroke="url(#blueGrad)" stroke-width="1.5" opacity="0.7"/>

  <!-- 顶部中文标签 -->
  <text x="100" y="42" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="bold" fill="#0091ea" letter-spacing="4">水费</text>
  <!-- 底部英文标签 -->
  <text x="100" y="192" text-anchor="middle" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="20" fill="#00b0ff" letter-spacing="2" opacity="0.8">WATER</text>
</svg>
